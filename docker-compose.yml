services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    hostname: jellyfin
    group_add:
      - ${RENDER_GROUP_ID}
    environment:
      - LANG=${LANG:-en_US.UTF-8}
      - LANGUAGE=${LANGUAGE:-en_US:en}
    volumes:
      - ${JELLYFIN_CONFIG_FOLDER:-./config}:/config
      - ${JELLYFIN_CACHE_FOLDER:-./cache}:/cache
      - /usr/share/fonts:/usr/local/share/fonts/custom
      - ${TVSHOWS_FOLDER}:/data/tvshows:ro
      - ${ANIMES_FOLDER}:/data/animes:ro
      - ${MOVIES_FOLDER}:/data/movies:ro
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      external:
        ipv4_address: ${JELLYFIN_IP}

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}
