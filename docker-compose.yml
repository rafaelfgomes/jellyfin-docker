services:
  jellyfin:
    image: jellyfin/jellyfin
    container_name: jellyfin
    hostname: jellyfin
    environment:
      - LANG=${LANG:-en_US.UTF-8}
      - LANGUAGE=${LANGUAGE:-en_US:en}
      - LC_ALL=${LANG:-en_US.UTF-8}
    volumes:
      - config:/config
      - cache:/cache
      - /usr/share/fonts:/usr/local/share/fonts/custom
      - ${TVSHOWS_FOLDER}:/data/tvshows
      - ${ANIMES_FOLDER}:/data/animes
      - ${MOVIES_FOLDER}:/data/movies
    devices:
      - /dev/dri:/dev/dri
    restart: unless-stopped
    networks:
      net:
        ipv4_address: ${APP_IP}
    dns:
      - ${DNS_IP_1}
      - ${DNS_IP_2:-9.9.9.9}

volumes:
  config:
    name: jellyfin-config
  cache:
    name: jellyfin-cache

networks:
  net:
    external: true
    name: apps-network
